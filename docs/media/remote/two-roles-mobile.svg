<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1154" viewBox="0 0 720 1154" role="img" aria-labelledby="title desc">
<title id="title">Your laptop can do both</title><desc id="desc">First use a desktop app on your laptop. Then use an app served by that same laptop on your phone.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315cdf"/></marker></defs>
<rect width="720" height="1154" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="67" font-size="41" font-weight="700" fill="#172238" text-anchor="start">Your laptop can do both.</text><rect x="30" y="110" width="660" height="434" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><circle cx="75" cy="162" r="23" fill="#315cdf"/><text x="75" y="172" font-size="29" font-weight="700" fill="white" text-anchor="middle">1</text><text x="116" y="173" font-size="34" font-weight="700" fill="#172238" text-anchor="start">Use your desktop’s app</text><g transform="translate(103 252) scale(1)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="104" height="74" rx="7"/><path d="M52 74V100 M30 100H74"/><rect x="116" y="0" width="23" height="100" rx="5"/><path d="M122 15H133 M122 26H133"/></g><text x="168" y="426" font-size="33" font-weight="700" fill="#172238" text-anchor="middle">Desktop</text><rect x="472" y="236" width="150" height="138" rx="14" fill="#e9f7f0" stroke="#b0dbc5" stroke-width="2"/><g transform="translate(482 252) scale(1)" fill="none" stroke="#16704b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="104" height="71" rx="7"/><path d="M8 80L0 99H120L112 80 M47 90H73"/></g><text x="547" y="426" font-size="33" font-weight="700" fill="#16704b" text-anchor="middle">Laptop</text><path d="M275 310H450" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="360" y="500" font-size="32" font-weight="400" fill="#52657e" text-anchor="middle">Desktop runs the app</text><rect x="30" y="574" width="660" height="434" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><circle cx="75" cy="626" r="23" fill="#315cdf"/><text x="75" y="636" font-size="29" font-weight="700" fill="white" text-anchor="middle">2</text><text x="116" y="637" font-size="34" font-weight="700" fill="#172238" text-anchor="start">Serve its own app</text><rect x="93" y="700" width="150" height="138" rx="14" fill="#e9f7f0" stroke="#b0dbc5" stroke-width="2"/><g transform="translate(103 716) scale(1)" fill="none" stroke="#16704b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="104" height="71" rx="7"/><path d="M8 80L0 99H120L112 80 M47 90H73"/></g><text x="168" y="890" font-size="33" font-weight="700" fill="#16704b" text-anchor="middle">Laptop</text><g transform="translate(482 716) scale(1)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="28" y="0" width="64" height="110" rx="12"/><path d="M49 10H71 M52 98H68"/></g><text x="547" y="890" font-size="33" font-weight="700" fill="#172238" text-anchor="middle">Phone</text><path d="M275 774H450" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="360" y="964" font-size="32" font-weight="400" fill="#52657e" text-anchor="middle">Laptop runs the app</text><text x="360" y="1068" font-size="31" font-weight="400" fill="#52657e" text-anchor="middle">Enable Remote in Pinokio on</text><text x="360" y="1114" font-size="31" font-weight="400" fill="#52657e" text-anchor="middle">each computer serving apps.</text></g></svg>