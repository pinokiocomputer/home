<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
<title id="title">Pinokio Remote: a public website, private app connections</title><desc id="desc">The website lists your installed apps in your browser. Within your private Tailscale network, phones, tablets, and laptops access apps served by your desktop or laptop. The apps run on those computers, and app traffic does not pass through pinokio.co.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315cdf"/></marker></defs>
<rect width="1400" height="1020" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="70" y="84" font-size="48" font-weight="700" fill="#172238" text-anchor="start">One website. Your own computers.</text><rect x="70" y="127" width="1260" height="130" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><text x="110" y="181" font-size="36" font-weight="700" fill="#315cdf" text-anchor="start">pinokio.co → Remote</text><text x="110" y="225" font-size="28" font-weight="400" fill="#172238" text-anchor="start">Your browser lists apps installed on the computers you connect.</text><path d="M285 257V326" fill="none" stroke="#8a9bb4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 9"/><rect x="70" y="326" width="1260" height="590" rx="32" fill="#eef4ff" stroke="#bdcff4" stroke-width="2"/><text x="109" y="377" font-size="23" font-weight="700" fill="#315cdf" text-anchor="start">YOUR PRIVATE NETWORK</text><text x="109" y="419" font-size="29" font-weight="700" fill="#172238" text-anchor="start">Use an app here</text><text x="892" y="419" font-size="29" font-weight="700" fill="#172238" text-anchor="start">The app runs here</text><rect x="104" y="453" width="370" height="390" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><g transform="translate(120 485) scale(0.88)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="28" y="0" width="64" height="110" rx="12"/><path d="M49 10H71 M52 98H68"/></g><text x="173" y="619" font-size="25" font-weight="600" fill="#172238" text-anchor="middle">Phone</text><g transform="translate(300 485) scale(0.88)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="0" width="100" height="110" rx="12"/><path d="M51 98H69"/></g><text x="353" y="619" font-size="25" font-weight="600" fill="#172238" text-anchor="middle">Tablet</text><g transform="translate(210 671) scale(0.88)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="104" height="71" rx="7"/><path d="M8 80L0 99H120L112 80 M47 90H73"/></g><text x="263" y="805" font-size="25" font-weight="600" fill="#172238" text-anchor="middle">Laptop</text><path d="M474 650H856" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="505" y="548" width="320" height="73" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="665" y="571" font-size="25" font-weight="700" fill="#315cdf" text-anchor="middle">Private, encrypted</text><text x="665" y="606" font-size="25" font-weight="700" fill="#315cdf" text-anchor="middle">app connections</text><text x="665" y="704" font-size="24" font-weight="400" fill="#52657e" text-anchor="middle">Powered by Tailscale</text><path d="M855 553V755" fill="none" stroke="#315cdf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M855 553H893" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M855 755H893" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="896" y="453" width="400" height="180" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><g transform="translate(919 493) scale(0.75)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="104" height="74" rx="7"/><path d="M52 74V100 M30 100H74"/><rect x="116" y="0" width="23" height="100" rx="5"/><path d="M122 15H133 M122 26H133"/></g><text x="1051" y="523" font-size="28" font-weight="700" fill="#172238" text-anchor="start">Desktop</text><text x="1051" y="566" font-size="23" font-weight="400" fill="#52657e" text-anchor="start">Video · images</text><rect x="896" y="663" width="400" height="180" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><g transform="translate(919 703) scale(0.75)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="104" height="71" rx="7"/><path d="M8 80L0 99H120L112 80 M47 90H73"/></g><text x="1051" y="733" font-size="28" font-weight="700" fill="#172238" text-anchor="start">Laptop</text><text x="1051" y="776" font-size="23" font-weight="400" fill="#52657e" text-anchor="start">Speech · chat</text><text x="700" y="886" font-size="25" font-weight="600" fill="#315cdf" text-anchor="middle">App traffic does not pass through pinokio.co.</text><text x="70" y="974" font-size="25" font-weight="400" fill="#52657e" text-anchor="start">Your app computers stay awake, online, and running Pinokio.</text></g></svg>