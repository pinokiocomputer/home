<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1385" viewBox="0 0 720 1385" role="img" aria-labelledby="title desc">
<title id="title">A public website, private connections</title><desc id="desc">Open pinokio.co Remote for the directory. Your phone, tablet, or laptop uses a private encrypted connection to the desktop or laptop running the app. App traffic does not pass through pinokio.co.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315cdf"/></marker></defs>
<rect width="720" height="1385" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="70" font-size="44" font-weight="700" fill="#172238" text-anchor="start">One website.</text><text x="44" y="126" font-size="44" font-weight="700" fill="#172238" text-anchor="start">Your own computers.</text><rect x="32" y="166" width="656" height="160" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><text x="60" y="226" font-size="38" font-weight="700" fill="#315cdf" text-anchor="start">pinokio.co → Remote</text><text x="60" y="278" font-size="34" font-weight="400" fill="#172238" text-anchor="start">Lists your installed apps</text><path d="M360 326V379" fill="none" stroke="#8a9bb4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 9"/><rect x="32" y="379" width="656" height="865" rx="24" fill="#eef4ff" stroke="#bdcff4" stroke-width="2"/><text x="60" y="429" font-size="30" font-weight="700" fill="#315cdf" text-anchor="start">YOUR PRIVATE NETWORK</text><text x="60" y="483" font-size="35" font-weight="700" fill="#172238" text-anchor="start">Use an app here</text><rect x="57" y="513" width="606" height="205" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><g transform="translate(90 542) scale(0.9)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="28" y="0" width="64" height="110" rx="12"/><path d="M49 10H71 M52 98H68"/></g><text x="145" y="689" font-size="30" font-weight="600" fill="#172238" text-anchor="middle">Phone</text><g transform="translate(295 542) scale(0.9)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="0" width="100" height="110" rx="12"/><path d="M51 98H69"/></g><text x="350" y="689" font-size="30" font-weight="600" fill="#172238" text-anchor="middle">Tablet</text><g transform="translate(493 542) scale(0.9)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="104" height="