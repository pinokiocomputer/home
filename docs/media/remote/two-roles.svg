<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="865" viewBox="0 0 1200 865" role="img" aria-labelledby="title desc">
<title id="title">One laptop, both roles</title><desc id="desc">First, the laptop uses a video app served by the desktop. Second, that same laptop serves a speech app to a phone. The machine serving each app performs the computation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315cdf"/></marker></defs>
<rect width="1200" height="865" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="65" y="82" font-size="46" font-weight="700" fill="#172238" text-anchor="start">Your laptop can do both.</text><text x="65" y="128" font-size="28" font-weight="400" fill="#52657e" text-anchor="start">Use another computer’s apps. Serve its own apps, too.</text><rect x="60" y="166" width="1080" height="284" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><circle cx="96" cy="208" r="20" fill="#315cdf"/><text x="96" y="216" font-size="24" font-weight="700" fill="white" text-anchor="middle">1</text><text x="132" y="217" font-size="28" font-weight="700" fill="#172238" text-anchor="start">Use an app running on your desktop</text><rect x="60" y="480" width="1080" height="284" rx="24" fill="#fff" stroke="#d3dfef" stroke-width="2"/><circle cx="96" cy="522" r="20" fill="#315cdf"/><text x="96" y="530" font-size="24" font-weight="700" fill="white" text-anchor="middle">2</text><text x="132" y="531" font-size="28" font-weight="700" fill="#172238" text-anchor="start">Serve an app running on that same laptop</text><g transform="translate(176 263) scale(0.8)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="104" height="74" rx="7"/><path d="M52 74V100 M30 100H74"/><rect x="116" y="0" width="23" height="100" rx="5"/><path d="M122 15H133 M122 26H133"/></g><text x="233" y="392" font-size="26" font-weight="700" fill="#172238" text-anchor="middle">Your desktop</text><rect x="851" y="250" width="147" height="107" rx="14" fill="#e9f7f0" stroke="#b0dbc5" stroke-width="2"/><g transform="translate(867 258) scale(0.94)" fill="none" stroke="#16704b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="104" height="71" rx="7"/><path d="M8 80L0 99H120L112 80 M47 90H73"/></g><text x="925" y="392" font-size="26" font-weight="700" fill="#16704b" text-anchor="middle">Your laptop</text><path d="M339 306H814" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="575" y="286" font-size="27" font-weight="700" fill="#315cdf" text-anchor="middle">Video app</text><text x="575" y="348" font-size="23" font-weight="400" fill="#52657e" text-anchor="middle">Desktop does the computation</text><rect x="161" y="565" width="147" height="107" rx="14" fill="#e9f7f0" stroke="#b0dbc5" stroke-width="2"/><g transform="translate(177 573) scale(0.94)" fill="none" stroke="#16704b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="104" height="71" rx="7"/><path d="M8 80L0 99H120L112 80 M47 90H73"/></g><text x="233" y="706" font-size="26" font-weight="700" fill="#16704b" text-anchor="middle">Your laptop</text><g transform="translate(877 564) scale(0.8)" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="28" y="0" width="64" height="110" rx="12"/><path d="M49 10H71 M52 98H68"/></g><text x="925" y="706" font-size="26" font-weight="700" fill="#172238" text-anchor="middle">Your phone</text><path d="M339 620H814" fill="none" stroke="#315cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="575" y="600" font-size="27" font-weight="700" fill="#315cdf" text-anchor="middle">Speech app</text><text x="575" y="662" font-size="23" font-weight="400" fill="#52657e" text-anchor="middle">Laptop does the computation</text><text x="600" y="821" font-size="24" font-weight="400" fill="#52657e" text-anchor="middle">Enable Remote in Pinokio on each computer that will serve apps.</text></g></svg>